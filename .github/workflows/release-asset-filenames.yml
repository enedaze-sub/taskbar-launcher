name: Show release asset filenames

on:
  push:
    branches: [main]
    paths: [.github/workflows/release-asset-filenames.yml]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to normalize
        required: true
        default: v8.3

permissions:
  contents: write

concurrency:
  group: release-asset-filenames
  cancel-in-progress: false

jobs:
  filenames:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag || 'v8.3' }}
    steps:
      - name: Preserve download files and show their actual filenames
        shell: python
        run: |
          import json, os, urllib.request
          from urllib.parse import quote
          repo = os.environ["REPOSITORY"]
          tag = os.environ["RELEASE_TAG"]
          base = "https://api.github.com/repos/" + repo
          headers = {"Authorization": "Bearer " + os.environ["GH_TOKEN"], "Accept": "application/vnd.github+json", "X-GitHub-Api-Version": "2022-11-28"}
          def api(path, data=None):
              request = urllib.request.Request(base + path, headers=headers, data=None if data is None else json.dumps(data).encode(), method="GET" if data is None else "PATCH")
              with urllib.request.urlopen(request, timeout=30) as response:
                  return json.load(response)
          release = api("/releases/tags/" + quote(tag, safe=""))
          assert not release["draft"], "Only published releases are normalized"
          assets = release["assets"]
          assert assets, "Release has no uploaded assets"
          snapshot = {a["id"]: {k: a.get(k) for k in ("name", "size", "digest", "browser_download_url")} for a in assets}
          # Preserve descriptions in the release body before clearing display labels.
          marker = "<!-- asset-downloads:start -->"
          endmarker = "<!-- asset-downloads:end -->"
          body = release.get("body") or ""
          if marker not in body:
              rows = ["## 다운로드 파일", "", "| 파일명 · 바로 다운로드 | 용도 |", "|---|---|"]
              for a in assets:
                  description = (a.get("label") or a["name"]).replace("|", " / ")
                  rows.append("| [" + a["name"] + "](" + a["browser_download_url"] + ") | " + description + " |")
              rows += ["", "**Source code (zip)**과 **Source code (tar.gz)**는 GitHub가 자동 생성한 소스 압축입니다. 설치하려면 위의 운영체제별 배포 패키지를 선택하세요."]
              body = marker + "\n" + "\n".join(rows) + "\n" + endmarker + "\n\n" + body
          body = body.replace("아래 Assets의 **Windows 실행파일·소스·번역 README**가 `taskbar-launcher-v8.3.zip`입니다.", "아래 **Assets**에서 **`taskbar-launcher-v8.3.zip`**을 선택하세요.")
          if body != release.get("body"):
              api("/releases/" + str(release["id"]), {"body": body})
          for a in assets:
              if a.get("label"):
                  api("/releases/assets/" + str(a["id"]), {"label": ""})
              print("Filename: " + a["name"])
          updated = api("/releases/tags/" + quote(tag, safe=""))
          assert len(updated["assets"]) == len(assets)
          for a in updated["assets"]:
              assert not a.get("label"), "Display label was not cleared"
              assert {k: a.get(k) for k in snapshot[a["id"]]} == snapshot[a["id"]], "Download asset changed"
          print("Verified: filenames displayed; file IDs, bytes, digests and URLs preserved.")
