name: Keep release downloads focused

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to organize
        required: true
        default: v8.4

permissions:
  contents: write

concurrency:
  group: release-downloads
  cancel-in-progress: false

jobs:
  downloads:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag || 'v8.4' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Organize packages and source downloads
        run: python 도구/release_downloads.py
